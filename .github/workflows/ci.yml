name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 类型检查 / Lint / 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: 准备环境
        run: cp .env.example .env

      - name: 安装依赖（postinstall 会生成 Prisma Client 并迁移本地库）
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: 单元测试
        run: pnpm test
