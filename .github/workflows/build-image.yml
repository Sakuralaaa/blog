name: 构建并推送 Docker 镜像

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/sakuralaaa/blog

jobs:
  build:
    name: 构建 ${{ matrix.arch }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    outputs:
      tag_version: ${{ steps.meta.outputs.tag_version }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 计算版本标签并校验一致性
        id: meta
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [[ -z "${VERSION}" ]]; then
            echo "未能读取应用版本号" >&2
            exit 1
          fi

          TAG_VERSION="${VERSION}"
          if [[ "${TAG_VERSION}" != v* ]]; then
            TAG_VERSION="v${TAG_VERSION}"
          fi

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME:-}" != "${TAG_VERSION}" ]]; then
              echo "Git 标签与 package.json 版本不一致: tag=${GITHUB_REF_NAME}, 期望=${TAG_VERSION}" >&2
              exit 1
            fi
            echo "已校验 Git 标签与 package.json 一致: ${TAG_VERSION}"
          else
            echo "当前触发类型不是 tag，跳过标签一致性校验（ref_type=${GITHUB_REF_TYPE:-unknown}, ref_name=${GITHUB_REF_NAME:-unknown}）"
          fi

          echo "tag_version=${TAG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "使用版本: ${TAG_VERSION}"

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 用本地脚本构建镜像（带缓存）
        env:
          TAG_SUFFIX: -${{ matrix.arch }}
          CACHE_SCOPE: image-${{ matrix.arch }}
        run: ./scripts/build-image.sh

      - name: 验证镜像首次启动与旧数据升级
        env:
          IMAGE: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag_version }}-${{ matrix.arch }}
        run: node scripts/test-image-startup.mjs

      - name: 推送架构镜像
        run: docker push "${IMAGE}:${{ steps.meta.outputs.tag_version }}-${{ matrix.arch }}"

  manifest:
    name: 合并多架构标签
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 推送版本与 latest 多架构清单
        env:
          TAG_VERSION: ${{ needs.build.outputs.tag_version }}
        run: |
          set -euo pipefail
          for tag in "${TAG_VERSION}" latest; do
            docker buildx imagetools create -t "${IMAGE}:${tag}" \
              "${IMAGE}:${TAG_VERSION}-amd64" "${IMAGE}:${TAG_VERSION}-arm64"
          done
