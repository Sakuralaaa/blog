<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3a5b"/>
      <stop offset="1" stop-color="#071f33"/>
    </linearGradient>
    <radialGradient id="lagoon" cx="0.42" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#7ff0e0"/>
      <stop offset="0.55" stop-color="#2cc7c9"/>
      <stop offset="1" stop-color="#1590b0"/>
    </radialGradient>
    <linearGradient id="reef" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6dc"/>
      <stop offset="1" stop-color="#f3d9a4"/>
    </linearGradient>
    <clipPath id="inner"><circle cx="256" cy="262" r="133"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#sea)"/>
  <!-- soft swell rings around the atoll -->
  <circle cx="256" cy="262" r="196" fill="none" stroke="#2a8fb5" stroke-opacity="0.18" stroke-width="10"/>
  <circle cx="256" cy="262" r="226" fill="none" stroke="#2a8fb5" stroke-opacity="0.09" stroke-width="8"/>
  <!-- the lagoon -->
  <circle cx="256" cy="262" r="136" fill="url(#lagoon)"/>
  <!-- the reef ring, open to the sea at the lower right -->
  <circle cx="256" cy="262" r="152" fill="none" stroke="url(#reef)" stroke-width="38"
          stroke-linecap="round" stroke-dasharray="880 75" transform="rotate(62 256 262)"/>
  <g clip-path="url(#inner)" fill="none" stroke="#ffffff" stroke-linecap="round">
    <path d="M150 268c22-16 44-16 66 0s44 16 66 0 44-16 66 0 44 16 66 0" stroke-width="13" stroke-opacity="0.9"/>
    <path d="M176 316c18-12 36-12 54 0s36 12 54 0 36-12 54 0" stroke-width="10" stroke-opacity="0.55"/>
  </g>
  <!-- sun glint -->
  <circle cx="214" cy="206" r="16" fill="#ffffff" fill-opacity="0.85"/>
</svg>
